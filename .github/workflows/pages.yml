name: Deploy dashboard to GitHub Pages

# Publishes full_model/rapm/dashboard as the site root ->
# https://reece236.github.io/BOOKER/
on:
  push:
    branches: [main]
    paths:
      - "full_model/rapm/dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a newer push supersede an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: full_model/rapm/dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
